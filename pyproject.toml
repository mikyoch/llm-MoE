[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-router-llm"
version = "0.1.0"
description = "Single-process, single-artifact orchestrator for multiple specialist LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "UnifiedRouterLLM" }]
dependencies = [
  "PyYAML>=6.0",
  "torch>=2.1.0",
  "transformers>=4.41.0",
  "huggingface_hub>=0.24.0",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.7.0",
]
distill = [
  "numpy>=1.26.0",
]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
unified-llm = "unified_llm.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["unified_llm*", "distill*"]
